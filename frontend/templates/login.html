<!doctype html>
<html lang="en">
  <head>
    <script src="/frontend/js/auth.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoneyMind | Login</title>
    <link rel="stylesheet" href="/frontend/style.css" />

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f2f5f8;
        margin: 0;
      }
      .auth-card {
        max-width: 420px;
        margin: 7vh auto;
        padding: 28px;
        background: white;
        border-radius: 14px;
        box-shadow: 0 5px 24px #17324d18;
      }
      .auth-card h1 {
        color: #17324d;
        margin-top: 0;
      }
      .auth-card label {
        display: block;
        margin-top: 14px;
      }
      .auth-card input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #ccd5df;
        border-radius: 7px;
      }
      .auth-card button {
        width: 100%;
        padding: 12px;
        margin-top: 18px;
        border: 0;
        border-radius: 7px;
        background: #17324d;
        color: white;
        cursor: pointer;
      }
      #auth-message {
        white-space: pre-wrap;
      }
      .switch {
        background: #e9eef3 !important;
        color: #17324d !important;
      }
    </style>
  </head>
  <body>
    <main class="auth-card">
      <h1>MoneyMind</h1>
      <p>Take control of your money.</p>
      <h2 id="auth-heading">Login</h2>
      <form id="auth-form">
        <div id="name-field" hidden>
          <label for="auth-name">Name</label>
          <input id="auth-name" autocomplete="name" />
        </div>
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="email" required />
        <label for="auth-password">Password</label>
        <input
          id="auth-password"
          type="password"
          autocomplete="current-password"
          required
          minlength="8"
        />
        <button id="auth-submit" type="submit">Login</button>
      </form>
      <button id="auth-switch" class="switch" type="button">
        Create an account
      </button>
      <p id="auth-message" role="status"></p>
    </main>
    <script>
      (() => {
        let registering = false;
        const form = document.getElementById("auth-form");
        const message = document.getElementById("auth-message");
        const nameField = document.getElementById("name-field");
        const password = document.getElementById("auth-password");

        document.getElementById("auth-switch").addEventListener("click", () => {
          registering = !registering;
          nameField.hidden = !registering;
          document.getElementById("auth-heading").textContent = registering
            ? "Create account"
            : "Login";
          document.getElementById("auth-submit").textContent = registering
            ? "Register"
            : "Login";
          document.getElementById("auth-switch").textContent = registering
            ? "Back to login"
            : "Create an account";
          password.autocomplete = registering
            ? "new-password"
            : "current-password";
          message.textContent = "";
        });

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          message.textContent = "Please wait...";
          const email = document.getElementById("auth-email").value.trim();
          const pass = password.value;
          const name = document.getElementById("auth-name").value.trim();

          try {
            const body = { email, password: pass };
            if (registering) body.name = name || email.split("@")[0];

            let response = await fetch(registering ? "/register" : "/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            let data = await response.json().catch(() => ({}));

            if (!response.ok) throw new Error(data.detail || "Request failed");

            if (registering) {
              response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password: pass }),
              });
              data = await response.json().catch(() => ({}));
              if (!response.ok)
                throw new Error(
                  data.detail || "Registration succeeded, but login failed",
                );
            }

            if (!data.access_token)
              throw new Error("Login response did not include an access token");

            localStorage.setItem("access_token", data.access_token);
            window.location.replace("/");
          } catch (error) {
            message.textContent = error.message || "Something went wrong.";
          }
        });
      })();
    </script>
  </body>
</html>
