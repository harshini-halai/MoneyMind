<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Upcoming Expense - MoneyMind</title>

    <link rel="stylesheet" href="/frontend/style.css" />
  </head>

  <body data-auth="required">
    <header class="header">
      <div class="header-content header-row">
        <div>
          <h1><a href="/">MoneyMind</a></h1>
          <p>Upcoming Expense</p>
        </div>
        <button type="button" id="logout-button" class="logout-button">Log out</button>
      </div>
    </header>

    <main class="dashboard">
      <section class="form-card">
        <div class="section-heading">
          <h2>Add Upcoming Expense</h2>
          <p>Plan for a bill or payment so Safe to Spend stays accurate</p>
        </div>

        <form id="upcoming-form">
          <div class="form-field">
            <label for="upcoming-description">Description</label>
            <input type="text" id="upcoming-description" placeholder="e.g. Rent, insurance premium" maxlength="255" required />
          </div>

          <div class="form-field">
            <label for="upcoming-amount">Amount (₹)</label>
            <input type="number" id="upcoming-amount" placeholder="0.00" min="0.01" step="0.01" required />
          </div>

          <div class="form-field">
            <label for="upcoming-date">Due date</label>
            <input type="date" id="upcoming-date" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="primary-button">Save Upcoming Expense</button>
            <a href="/" class="secondary-button">Cancel</a>
          </div>
        </form>

        <p id="upcoming-message" class="message" hidden></p>
      </section>
    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/upcoming.js"></script>
  </body>
</html>
