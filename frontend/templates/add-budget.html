<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Budget - MoneyMind</title>
    <script src="/frontend/js/theme.js"></script>
    <link rel="stylesheet" href="/frontend/style.css" />
  </head>

  <body data-auth="required" data-page="add-budget" data-title="Add Budget">
    <main class="content">
      <div class="page-head">
        <h1>Add Budget</h1>
        <p>Set a monthly spending limit for a category</p>
      </div>
      <p id="flash-message" class="message" hidden></p>
      <section class="form-card">
        <form id="budget-form">
          <div class="form-field">
            <label for="budget-category">Category</label>
            <select id="budget-category" required>
              <option value="">Select category</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-field">
            <label for="budget-amount">Budget amount (₹)</label>
            <input type="number" id="budget-amount" placeholder="0.00" min="0.01" step="0.01" required />
          </div>
          <div class="form-field">
            <label for="budget-month">Month</label>
            <input type="month" id="budget-month" required />
          </div>
          <div class="form-actions">
            <button type="submit" class="primary-button">Save Budget</button>
            <a href="/" class="secondary-button">Cancel</a>
          </div>
        </form>

        <p id="budget-message" class="message" hidden></p>
      </section>
    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script src="/frontend/js/budget.js"></script>
  </body>
</html>
