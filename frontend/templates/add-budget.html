<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Budget - MoneyMind</title>

    <link rel="stylesheet" href="/frontend/style.css" />
  </head>

  <body data-auth="required">
    <header class="header">
      <div class="header-content header-row">
        <div>
          <h1><a href="/">MoneyMind</a></h1>
          <p>Add Monthly Budget</p>
        </div>
        <button type="button" id="logout-button" class="logout-button">Log out</button>
      </div>
    </header>

    <main class="dashboard">
      <section class="form-card">
        <div class="section-heading">
          <h2>Add Budget</h2>
          <p>Set a spending limit for a category</p>
        </div>

        <form id="budget-form">
          <div class="form-field">
            <label for="budget-category">Category</label>
            <select id="budget-category" required>
              <option value="">Select category</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-field">
            <label for="budget-amount">Budget amount (₹)</label>
            <input type="number" id="budget-amount" placeholder="0.00" min="0.01" step="0.01" required />
          </div>

          <div class="form-field">
            <label for="budget-month">Month</label>
            <input type="month" id="budget-month" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="primary-button">Save Budget</button>
            <a href="/" class="secondary-button">Cancel</a>
          </div>
        </form>

        <p id="budget-message" class="message" hidden></p>
      </section>
    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/budget.js"></script>
  </body>
</html>
