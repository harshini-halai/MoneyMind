<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Expense - MoneyMind</title>

    <link rel="stylesheet" href="/frontend/style.css" />
  </head>

  <body data-auth="required">
    <header class="header">
      <div class="header-content header-row">
        <div>
          <h1><a href="/">MoneyMind</a></h1>
          <p>Add Expense</p>
        </div>
        <button type="button" id="logout-button" class="logout-button">Log out</button>
      </div>
    </header>

    <main class="dashboard">
      <section class="form-card">
        <div class="section-heading">
          <h2>Add Expense</h2>
          <p>Record money you spent</p>
        </div>

        <form id="expense-form">
          <div class="form-field">
            <label for="expense-description">Description</label>
            <input type="text" id="expense-description" placeholder="e.g. Lunch" maxlength="255" required />
          </div>

          <div class="form-field">
            <label for="expense-category">Category</label>
            <select id="expense-category" required>
              <option value="">Select category</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-field">
            <label for="expense-amount">Amount (₹)</label>
            <input type="number" id="expense-amount" placeholder="0.00" min="0.01" step="0.01" required />
          </div>

          <div class="form-field">
            <label for="expense-date">Date</label>
            <input type="date" id="expense-date" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="primary-button">Save Expense</button>
            <a href="/" class="secondary-button">Cancel</a>
          </div>
        </form>

        <p id="expense-message" class="message" hidden></p>
      </section>
    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/transaction.js"></script>
  </body>
</html>
