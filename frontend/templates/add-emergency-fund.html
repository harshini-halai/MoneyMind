<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Emergency Fund - MoneyMind</title>
    <script src="/frontend/js/theme.js"></script>
    <link rel="stylesheet" href="/frontend/style.css" />
  </head>

  <body data-auth="required" data-page="add-emergency-fund" data-title="Add Emergency Fund">
    <main class="content">
      <div class="page-head">
        <h1>Add Emergency Fund</h1>
        <p>Build a safety net for the unexpected</p>
      </div>
      <p id="flash-message" class="message" hidden></p>
      <section class="form-card">
        <form id="emergency-fund-form">
          <div class="form-field">
            <label for="emergency-fund-amount">Amount (₹)</label>
            <input type="number" id="emergency-fund-amount" placeholder="0.00" min="0.01" step="0.01" required />
          </div>
          <div class="form-field">
            <label for="emergency-fund-description">Description</label>
            <input type="text" id="emergency-fund-description" placeholder="e.g. Medical reserve" maxlength="255" required />
          </div>
          <div class="form-field">
            <label for="emergency-fund-date">Date</label>
            <input type="date" id="emergency-fund-date" required />
          </div>
          <div class="form-actions">
            <button type="submit" class="primary-button">Save Emergency Fund</button>
            <a href="/" class="secondary-button">Cancel</a>
          </div>
        </form>

        <p id="emergency-fund-message" class="message" hidden></p>
      </section>
    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script src="/frontend/js/emergency-fund.js"></script>
  </body>
</html>
