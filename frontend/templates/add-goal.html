<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Dream Goal - MoneyMind</title>
    <script src="/frontend/js/theme.js"></script>
    <link rel="stylesheet" href="/frontend/style.css" />
  </head>

  <body data-auth="required" data-page="add-goal" data-title="New Dream Goal">
    <main class="content">
      <div class="page-head">
        <h1>New Dream Goal</h1>
        <p>Pick something to save for. Money you put towards it stays protected.</p>
      </div>
      <p id="flash-message" class="message" hidden></p>
      <section class="form-card">
        <form id="goal-form">
          <div class="form-field">
            <label for="goal-name">Goal name</label>
            <input type="text" id="goal-name" placeholder="e.g. Laptop, Goa trip" maxlength="100" required />
          </div>
          <div class="form-field">
            <label for="goal-amount">Target amount (₹)</label>
            <input type="number" id="goal-amount" placeholder="0.00" min="0.01" step="0.01" required />
          </div>
          <div class="form-field">
            <label for="goal-date">Target date (optional)</label>
            <input type="date" id="goal-date" />
          </div>
          <div class="form-actions">
            <button type="submit" class="primary-button">Create Goal</button>
            <a href="/" class="secondary-button">Cancel</a>
          </div>
        </form>

        <p id="goal-message" class="message" hidden></p>
      </section>
    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script src="/frontend/js/goals.js"></script>
  </body>
</html>
