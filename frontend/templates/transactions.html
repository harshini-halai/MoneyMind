<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions - MoneyMind</title>
    <script src="/frontend/js/theme.js"></script>
    <link rel="stylesheet" href="/frontend/style.css" />
  </head>

  <body data-auth="required" data-page="transactions" data-title="Transactions">
    <main class="content">
      <div class="page-head">
        <h1>Transactions</h1>
        <p>View and manage your income and expenses</p>
      </div>
      <p id="flash-message" class="message" hidden></p>
      <section class="card">
        <p id="transactions-message" class="message" hidden></p>

        <div class="transactions-list">
          <p class="empty-state">Loading transactions...</p>
        </div>

        <div class="form-actions" style="margin-top: 18px">
          <button id="refresh-transactions" type="button" class="secondary-button">
            Refresh
          </button>
          <a href="/add-expense" class="primary-button">+ Add Expense</a>
        </div>
      </section>
    </main>

    <dialog id="edit-dialog">
      <form id="edit-form">
        <h2>Update transaction</h2>
        <input type="hidden" id="edit-id" />

        <div class="form-field">
          <label for="edit-description">Description</label>
          <input type="text" id="edit-description" maxlength="255" required />
        </div>

        <div class="form-field">
          <label for="edit-amount">Amount (₹)</label>
          <input type="number" id="edit-amount" min="0.01" step="0.01" required />
        </div>

        <div class="form-field">
          <label for="edit-category">Category</label>
          <select id="edit-category" required>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-field">
          <label for="edit-date">Date</label>
          <input type="date" id="edit-date" required />
        </div>

        <div class="form-field">
          <label for="edit-type">Type</label>
          <select id="edit-type" required>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>

        <p id="edit-message" class="message" hidden></p>

        <div class="form-actions">
          <button type="submit" id="edit-save" class="primary-button">Save</button>
          <button type="button" id="edit-cancel" class="secondary-button">Cancel</button>
        </div>
      </form>
    </dialog>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/layout.js"></script>
    <script src="/frontend/js/transaction.js"></script>
  </body>
</html>
